server:
  servlet:
    context-path: /api/v1

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:dummy}
    secret-key: ${AWS_SECRET_KEY:dummy}
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${AWS_BUCKET_NAME:dummy}

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail: # Email configuration
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:dummy}
    password: ${SPRING_MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  inventory-login-url: https://pharma-test.tiameds.ai/
  admin-frontend-url: https://admin-test.tiameds.ai
  admin-seed:
    full-name: ${ADMIN_SEED_NAME}
    email: ${ADMIN_SEED_EMAIL}
    password: ${ADMIN_SEED_PASSWORD}

microservices:
  inventory-service:
    base-url: https://apipharma.tiameds.ai
    # Must match internal.api-key configured in the inventory service
    api-key: ${INVENTORY_INTERNAL_API_KEY:}

  # Twilio sms
twilio:
  account-sid: 1234567890
  auth-token: 1234567890
  verify:
    service-sid: 1234567890

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

security:
  jwt:
    # HS256 secret, must be at least 32 characters. Always override in prod.
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_ACCESS_VALIDITY_MINUTES}
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY_DAYS}
    refresh-cookie:
      # Set secure=true and same-site=None in prod if the frontend is on a different site
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAMESITE:Lax}