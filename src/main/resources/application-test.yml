server:
  servlet:
    context-path: /api/v1

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:dummy}
    secret-key: ${AWS_SECRET_KEY:dummy}
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${AWS_BUCKET_NAME:dummy}

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail: # Email configuration
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:dummy}
    password: ${SPRING_MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  inventory-login-url: https://pharma-test.tiameds.ai/
  admin-frontend-url: https://admin-test.tiameds.ai

microservices:
  inventory-service:
    base-url: https://apipharma.tiameds.ai

  # Twilio sms
twilio:
  account-sid: 1234567890
  auth-token: 1234567890
  verify:
    service-sid: 1234567890

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true